[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technocore-rosetta"
version = "0.1.0"
description = "Deterministic local Technocore interoperability observatory"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "cryptography>=50,<51",
  "httpx>=0.28,<0.29",
  "pydantic>=1.10.26,<2",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6,<7",
  "mypy>=1.11,<3",
  "PyNaCl==1.6.2",
  "pytest>=9.0.3,<10",
  "ruff>=0.6,<1",
]

[project.scripts]
rosetta = "rosetta.cli:main"
rosetta-evolution = "rosetta.evolution_cli:main"
rosetta-signer = "rosetta_signer.service:main"
rosetta-observer = "rosetta.observer:main"
rosetta-egress = "rosetta.egress:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --basetemp=.pytest-tmp"
testpaths = ["tests"]
markers = ["container: requires a running OCI container engine"]

[tool.coverage.run]
branch = true
source = ["rosetta", "rosetta_signer"]
omit = [
  "src/rosetta/target_service.py",
  "src/rosetta_signer/oneshot.py",
  "src/rosetta_signer/service.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
packages = ["rosetta", "rosetta_signer"]
mypy_path = "src"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

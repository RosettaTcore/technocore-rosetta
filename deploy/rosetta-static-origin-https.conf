server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /var/lib/rosetta/acme;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location / {
        return 308 https://__ROSETTA_PUBLIC_IP__$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name __ROSETTA_PUBLIC_IP__;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/__ROSETTA_PUBLIC_IP__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__ROSETTA_PUBLIC_IP__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /var/lib/rosetta/public;
    autoindex off;
    disable_symlinks on from=$document_root;

    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    if ($host != "__ROSETTA_PUBLIC_IP__") {
        return 444;
    }

    location = /healthz {
        default_type application/json;
        limit_except GET HEAD { deny all; }
        return 200 '{"schema":"rosetta.static-origin-health.v1","status":"ok"}\n';
    }

    location = /.well-known/agent.json {
        default_type application/json;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location = /service-card.json {
        default_type application/json;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location = /service-card.attestation.json {
        default_type application/json;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location = /skill.md {
        default_type text/markdown;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ~ ^/schemas/rosetta-(request|result)-v1\.json$ {
        default_type application/json;
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location ~ "^/reports/[0-9a-f]{64}/(attestation\\.json|checksums\\.txt|run\\.json|matrix\\.json|summary\\.md|evidence/[a-z0-9._-]+\\.json|reproduce/[a-z0-9._-]+\\.(json|txt))$" {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}

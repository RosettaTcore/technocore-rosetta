version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Ljubljana
    cooldown:
      default-days: 7
    # The hand-maintained requirements*.lock files are not updated by Dependabot. Keep routine pip
    # proposals off until the project adopts a supported deterministic lock generator. Dependabot
    # security updates use a separate internal limit and remain enabled in repository settings.
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /adapters
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Ljubljana
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    versioning-strategy: increase
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Ljubljana
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps

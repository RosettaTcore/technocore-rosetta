version: 2

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Ljubljana
    cooldown:
      default-days: 7
    # Python dependency proposals must update requirements*.in, regenerate both hash-locked files
    # with tools/lock_requirements.sh and pass the deterministic lock check.
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /adapters
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Ljubljana
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    versioning-strategy: increase
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Ljubljana
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps

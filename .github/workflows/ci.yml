name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  acceptance:
    name: Host acceptance (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NO_COLOR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.5"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: adapters/package-lock.json
          package-manager-cache: false

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock

      - name: Verify deterministic Python lockfiles
        run: make lock-check UV=uv

      - name: Install locked TypeScript dependencies
        run: npm --prefix adapters ci --ignore-scripts

      - name: Run host acceptance gate
        run: make acceptance PYTHON=python

  python-minimum:
    name: Minimum Python (3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NO_COLOR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install hash-locked Python dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.lock

      - name: Verify deterministic Python lockfiles
        run: make lock-check UV=uv

      - name: Verify minimum supported runtime
        run: make lint type coverage secret-scan PYTHON=python

  observer-image:
    name: Assembled observer image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Materialize the production release tree
        run: |
          archive="$RUNNER_TEMP/release.tar.gz"
          release_tree="$RUNNER_TEMP/release-tree"
          git archive --format=tar.gz --output "$archive" "$GITHUB_SHA"
          python3 - "$archive" "$release_tree" <<'PY'
          import sys
          from pathlib import Path

          from tools.release_package import extract_archive

          extract_archive(Path(sys.argv[1]), Path(sys.argv[2]))
          PY

      - name: Build release image without host layer-cache reuse
        run: |
          docker build --no-cache \
            --file "$RUNNER_TEMP/release-tree/deploy/Dockerfile" \
            --tag rosetta/observer:ci "$RUNNER_TEMP/release-tree"

      - name: Exercise the isolated staging entrypoints
        run: |
          for module in rosetta.egress rosetta.observer; do
            docker run --rm --network none --read-only --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges \
              rosetta/observer:ci "$module" --help >/dev/null
          done

      - name: Exercise the numeric verifier privilege drop
        run: |
          docker run --rm --network none --read-only --user 0:0 \
            --cap-drop ALL --cap-add SETUID --cap-add SETGID \
            --security-opt no-new-privileges --entrypoint python \
            rosetta/observer:ci -c '
          import subprocess
          result = subprocess.run(
              ["/usr/bin/id", "-u"],
              check=True,
              capture_output=True,
              text=True,
              user=65532,
              group=65532,
              extra_groups=(),
          )
          assert result.stdout.strip() == "65532"
          '

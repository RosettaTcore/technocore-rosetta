name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  acceptance:
    name: Host acceptance (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: "true"
      NO_COLOR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12.5"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20.9.0"
          cache: npm
          cache-dependency-path: adapters/package-lock.json
          package-manager-cache: false

      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements-dev.lock

      - name: Install locked TypeScript dependencies
        run: npm --prefix adapters ci --ignore-scripts

      - name: Run host acceptance gate
        run: make acceptance PYTHON=python

  python-minimum:
    name: Minimum Python (3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      NO_COLOR: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.10.14"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install locked Python dependencies
        run: python -m pip install --requirement requirements-dev.lock

      - name: Verify minimum supported runtime
        run: make lint type coverage secret-scan PYTHON=python

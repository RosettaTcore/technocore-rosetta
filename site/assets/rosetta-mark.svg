<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Technocore Rosetta mark</title>
  <desc id="desc">Four runtime paths converge on a faceted deterministic evidence core.</desc>
  <defs>
    <linearGradient id="tile" x1="12" y1="10" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141D39"/>
      <stop offset="0.52" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#070A14"/>
    </linearGradient>
    <linearGradient id="cyan" x1="15" y1="18" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8CEEFF"/>
      <stop offset="1" stop-color="#20C8F4"/>
    </linearGradient>
    <linearGradient id="violet" x1="48" y1="48" x2="81" y2="78" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7452E8"/>
    </linearGradient>
    <linearGradient id="core" x1="38" y1="36" x2="60" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.46" stop-color="#EAFBFF"/>
      <stop offset="1" stop-color="#C9D6FF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(48 48) rotate(90) scale(33)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="0.58" stop-color="#38D9FF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#38D9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="2" y="2" width="92" height="92" rx="23" fill="url(#tile)"/>
  <rect x="2.75" y="2.75" width="90.5" height="90.5" rx="22.25" fill="none" stroke="#A8C4FF" stroke-opacity="0.16" stroke-width="1.5"/>
  <circle cx="48" cy="48" r="33" fill="url(#halo)"/>

  <!-- Four reviewed runtime paths. Filled geometry stays crisp at favicon sizes. -->
  <path d="M17 22.5 22.5 17H35l11 20-9 9-20-11V22.5Z" fill="url(#cyan)"/>
  <path d="M61 17h12.5l5.5 5.5V35L59 46l-9-9 11-20Z" fill="url(#violet)"/>
  <path d="M17 61l20-11 9 9-11 20H22.5L17 73.5V61Z" fill="url(#cyan)"/>
  <path d="m59 50 20 11v12.5L73.5 79H61L50 59l9-9Z" fill="url(#violet)"/>

  <!-- Negative-space separators keep the four paths independently legible. -->
  <path d="m36.9 42.6 5.7-5.7 5.4 5.4 5.4-5.4 5.7 5.7-5.4 5.4 5.4 5.4-5.7 5.7-5.4-5.4-5.4 5.4-5.7-5.7 5.4-5.4-5.4-5.4Z" fill="#0B1020"/>

  <!-- One canonical evidence core, faceted rather than certification-shaped. -->
  <path d="m48 35 13 13-13 13-13-13 13-13Z" fill="url(#core)"/>
  <path d="m48 35 13 13H48V35Z" fill="#FFFFFF" fill-opacity="0.66"/>
  <path d="m48 61-13-13h13v13Z" fill="#A9C7FF" fill-opacity="0.55"/>
  <path d="m48 42 6 6-6 6-6-6 6-6Z" fill="#0B1020"/>
</svg>
